<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    :root {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #1f2937;
      background: #f4f1ea;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(560px, calc(100% - 32px));
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.75rem;
      line-height: 1.3;
    }

    ul {
      margin: 0;
      padding-left: 22px;
      display: grid;
      gap: 10px;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <ul>
      <li>5 идей для постов для экспертов</li>
      <li>3 идеи сторис на сегодня</li>
      <li>контент-план на неделю</li>
    </ul>
  </main>
</body>
</html>
