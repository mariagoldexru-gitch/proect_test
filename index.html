<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f6efe4;
      --muted: #c9bba8;
      --card: rgba(255, 247, 236, 0.08);
      --card-hover: rgba(255, 247, 236, 0.14);
      --accent: #ffb45c;
      --accent-2: #7ee0c8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Manrope, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% -10%, #3a2a55 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 20%, #1f4d4a 0%, transparent 50%),
        linear-gradient(160deg, #120d18 0%, #1a1424 45%, #10151a 100%);
      overflow: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.45;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite;
    }

    .orb-a {
      width: 280px;
      height: 280px;
      background: #ffb45c;
      top: 8%;
      left: -60px;
    }

    .orb-b {
      width: 220px;
      height: 220px;
      background: #5eead4;
      right: -40px;
      bottom: 10%;
      animation-delay: -5s;
      animation-duration: 18s;
    }

    main {
      position: relative;
      width: min(620px, calc(100% - 32px));
      padding: 40px 36px 32px;
      border: 1px solid rgba(255, 247, 236, 0.12);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 247, 236, 0.08), rgba(255, 247, 236, 0.03));
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      animation: rise 0.8s ease both;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      animation: rise 0.7s 0.1s ease both;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .subtitle {
      margin: 0 0 28px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      color: var(--muted);
      animation: rise 0.8s 0.15s ease both;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid rgba(255, 247, 236, 0.08);
      opacity: 0;
      animation: rise 0.7s ease forwards;
      transition: background 0.25s ease, transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    li:nth-child(1) { animation-delay: 0.25s; }
    li:nth-child(2) { animation-delay: 0.4s; }
    li:nth-child(3) { animation-delay: 0.55s; }

    li:hover {
      background: var(--card-hover);
      transform: translateY(-4px) scale(1.015);
      border-color: rgba(255, 180, 92, 0.35);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
    }

    .mark {
      flex: 0 0 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-weight: 800;
      background: rgba(255, 180, 92, 0.16);
      color: var(--accent);
    }

    li:nth-child(2) .mark {
      background: rgba(126, 224, 200, 0.16);
      color: var(--accent-2);
    }

    li:nth-child(3) .mark {
      background: rgba(196, 181, 253, 0.16);
      color: #d8b4fe;
    }

    .label {
      font-size: 1.05rem;
      font-weight: 700;
    }

    @keyframes rise {
      from { opacity: 0; translate: 0 18px; }
      to { opacity: 1; translate: 0 0; }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(24px, -18px) scale(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }

      li { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <main>
    <span class="eyebrow">для экспертов и авторов</span>
    <h1>Генератор идей для постов</h1>
    <p class="subtitle">три быстрых старта, чтобы контент не застревал</p>
    <ul>
      <li>
        <span class="mark">01</span>
        <span class="label">5 идей для постов для экспертов</span>
      </li>
      <li>
        <span class="mark">02</span>
        <span class="label">3 идеи сторис на сегодня</span>
      </li>
      <li>
        <span class="mark">03</span>
        <span class="label">контент-план на неделю</span>
      </li>
    </ul>
  </main>
</body>
</html>
